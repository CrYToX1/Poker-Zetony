<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Kámoši Poker - Žetony</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { margin:0; padding:10px; background:#0a3d0a; color:white; font-family:Arial; text-align:center; }
    h1 { margin:15px 0; }
    .player { background:#1a5c1a; margin:12px auto; padding:15px; border-radius:12px; max-width:340px; }
    input, button { padding:12px; margin:6px; font-size:17px; border-radius:8px; }
    button { background:#ffcc00; color:black; border:none; font-weight:bold; }
    .red-btn { background:#c00; color:white; }
  </style>
</head>
<body>
  <h1>Poker - Žetony</h1>

  <div id="login">
    <input type="text" id="name" placeholder="Tvoje jméno" style="padding:12px; width:80%; font-size:18px;">
    <br><br>
    <button onclick="joinGame()">Připojit se ke stolu</button>
  </div>

  <div id="game" style="display:none">
    <h2>Pot: <span id="pot">0</span></h2>
    <div id="players"></div>

    <div style="margin:25px 0;">
      <input type="number" id="amount" value="100" style="width:130px">
      <button onclick="bet()">Vsadit</button>
      <button onclick="fold()">Fold</button>
    </div>

    <button onclick="resetAll()" class="red-btn">Reset všem žetony</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCwOIzKGHGHkwqNh3fwKT9zhp4vFHgr36I",
      authDomain: "kamas-poker.firebaseapp.com",
      databaseURL: "https://kamas-poker-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kamas-poker",
      storageBucket: "kamas-poker.firebasestorage.app",
      messagingSenderId: "834451733200",
      appId: "1:834451733200:web:3c4d05a957026a01617cd5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tableRef = db.ref('mainTable');

    let myId = 'p_' + Math.random().toString(36).substr(2, 9);
    let myName = "";
    const ADMIN_NAME = "Vasek";        // ← tady můžeš změnit jméno admina

    function isAdmin() {
      return myName.toLowerCase() === ADMIN_NAME.toLowerCase();
    }

    function joinGame() {
      myName = document.getElementById('name').value.trim();
      if (!myName) return alert("Zadej jméno!");

      document.getElementById('login').style.display = 'none';
      document.getElementById('game').style.display = 'block';

      tableRef.child(myId).set({
        name: myName,
        chips: 5000,
        bet: 0,
        folded: false
      });
    }

    tableRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      let html = '';
      let totalPot = 0;

      Object.keys(data).forEach(id => {
        const p = data[id];
        if (!p || !p.name) return;

        totalPot += Number(p.bet) || 0;

        let winButton = '';
        if (isAdmin()) {
          winButton = `<br><button onclick="awardWin('${id}')" style="background:#00c000; color:white; padding:6px 12px; font-size:14px; margin-top:8px;">Vyhrál</button>`;
        }

        html += `
          <div class="player">
            <strong>${p.name}</strong><br>
            Žetony: <b>${p.chips || 0}</b><br>
            Sázka: ${p.bet || 0}
            ${p.folded ? ' <span style="color:red;">(folded)</span>' : ''}
            ${winButton}
          </div>`;
      });

      document.getElementById('players').innerHTML = html;
      document.getElementById('pot').textContent = totalPot;

      // Zobrazit/Skrýt reset tlačítko jen pro admina
      const resetBtn = document.querySelector('.red-btn');
      if (resetBtn) resetBtn.style.display = isAdmin() ? 'inline-block' : 'none';
    });

    window.bet = function() {
      const amount = parseInt(document.getElementById('amount').value) || 100;
      tableRef.child(myId).once('value', (snap) => {
        const p = snap.val() || {};
        if (p.chips >= amount) {
          tableRef.child(myId).update({
            chips: p.chips - amount,
            bet: (p.bet || 0) + amount
          });
        }
      });
    };

    window.fold = function() {
      tableRef.child(myId).update({ folded: true });
    };

    window.awardWin = function(winnerId) {
      if (!isAdmin()) return;

      tableRef.once('value', (snapshot) => {
        const data = snapshot.val() || {};
        let pot = 0;
        Object.keys(data).forEach(id => pot += Number(data[id].bet) || 0);

        if (pot === 0) return alert("Pot je prázdný");

        if (confirm(`Přičíst pot (${pot}) hráči ${data[winnerId]?.name}?`)) {
          tableRef.child(winnerId).once('value', (snap) => {
            const winner = snap.val();
            tableRef.child(winnerId).update({
              chips: (winner.chips || 0) + pot,
              bet: 0,
              folded: false
            });

            // Vynulovat sázky všem
            Object.keys(data).forEach(id => {
              tableRef.child(id).update({ bet: 0, folded: false });
            });
          });
        }
      });
    };

    window.resetAll = function() {
      if (!isAdmin()) return;
      if (confirm("Opravdu resetovat všechny žetony na 5000?")) {
        tableRef.remove().then(() => {
          if (myName) {
            setTimeout(() => {
              tableRef.child(myId).set({
                name: myName,
                chips: 5000,
                bet: 0,
                folded: false
              });
            }, 600);
          }
        });
      }
    };
</script>
</body>
</html>
