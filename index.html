<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Kámoši Poker - Žetony</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { margin:0; padding:10px; background:#0a3d0a; color:white; font-family:Arial; text-align:center; }
    h1 { margin:15px 0; }
    .player { background:#1a5c1a; margin:12px auto; padding:15px; border-radius:12px; max-width:340px; }
    input, button { padding:12px; margin:6px; font-size:17px; border-radius:8px; }
    button { background:#ffcc00; color:black; border:none; font-weight:bold; }
    .red-btn { background:#c00; color:white; }
  </style>
</head>
<body>
  <h1>Kámoši Poker - Žetony</h1>

  <div id="login">
    <input type="text" id="name" placeholder="Tvoje jméno" style="padding:12px; width:80%; font-size:18px;">
    <br><br>
    <button onclick="joinGame()">Připojit se ke stolu</button>
  </div>

  <div id="game" style="display:none">
    <h2>Pot: <span id="pot">0</span></h2>
    <div id="players"></div>

    <div style="margin:25px 0;">
      <input type="number" id="amount" value="100" style="width:130px">
      <button onclick="bet()">Vsadit</button>
      <button onclick="fold()">Fold</button>
    </div>

    <button onclick="resetAll()" class="red-btn">Reset všem žetony</button>
  </div>

  <script>
    console.log("Script načten");

    const firebaseConfig = {
      apiKey: "AIzaSyCwOIzKGHGHkwqNh3fwKT9zhp4vFHgr36I",
      authDomain: "kamas-poker.firebaseapp.com",
      databaseURL: "https://kamas-poker-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kamas-poker",
      storageBucket: "kamas-poker.firebasestorage.app",
      messagingSenderId: "834451733200",
      appId: "1:834451733200:web:3c4d05a957026a01617cd5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tableRef = db.ref('mainTable');

    let myId = 'p_' + Math.random().toString(36).substr(2, 9);
    let myName = "";

    function joinGame() {
      myName = document.getElementById('name').value.trim();
      if (!myName) return alert("Zadej jméno!");

      document.getElementById('login').style.display = 'none';
      document.getElementById('game').style.display = 'block';

      tableRef.child(myId).set({ name: myName, chips: 5000, bet: 0, folded: false });
      console.log("Připojen jako:", myName);
    }

    tableRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      let html = '';
      let totalPot = 0;

      Object.keys(data).forEach(id => {
        const p = data[id];
        totalPot += Number(p.bet) || 0;
        html += `<div class="player"><strong>${p.name}</strong><br>Žetony: <b>${p.chips}</b><br>Sázka: ${p.bet || 0} ${p.folded ? '(folded)' : ''}</div>`;
      });

      document.getElementById('players').innerHTML = html;
      document.getElementById('pot').textContent = totalPot;
    });

    window.bet = function() {
      console.log("Vsadit kliknuto");
      const amount = parseInt(document.getElementById('amount').value) || 100;
      tableRef.child(myId).once('value', (snap) => {
        const p = snap.val();
        if (p && p.chips >= amount) {
          tableRef.child(myId).update({
            chips: p.chips - amount,
            bet: (p.bet || 0) + amount
          });
        }
      });
    };

    window.fold = function() {
      console.log("Fold kliknuto");
      tableRef.child(myId).update({ folded: true });
    };

    window.resetAll = function() {
      if (confirm("Resetovat všem?")) tableRef.remove();
    };

    window.onbeforeunload = () => tableRef.child(myId).remove();
  </script>
</body>
</html>
